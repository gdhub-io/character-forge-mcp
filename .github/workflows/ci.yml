name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    name: Server (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Known vulnerabilities in what ships (not dev tools) fail the build.
      - run: npm audit --omit=dev --audit-level=high
      # The video tests (two-piece join, light hold, chain) run on real clips; one job is enough, the others skip them.
      # A static build, pinned and checksum-checked, takes seconds where apt-get took 22 minutes.
      - name: ffmpeg (Node 22 only)
        if: matrix.node == 22
        env:
          FFMPEG_URL: https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-n8.1.3-27-g8dca1586f4-linux64-gpl-8.1.tar.xz
          FFMPEG_SHA256: 41e9c565594c390622cf968d82fa4135d9e9a11d06c1515644288cbc844e3380
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ffmpeg.tar.xz" "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP"
          dirname "$(ls "$RUNNER_TEMP"/ffmpeg-*/bin/ffmpeg)" >> "$GITHUB_PATH"
          echo "CI_FFMPEG=1" >> "$GITHUB_ENV"
      # Builds, then runs the unit tests and an end-to-end MCP client/server test. Never calls paid APIs.
      - run: npm test

  site:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm audit --omit=dev --audit-level=high
        working-directory: site
      # Type-check and build with the media committed in site/public/characters.
      - run: npm run build
        working-directory: site
