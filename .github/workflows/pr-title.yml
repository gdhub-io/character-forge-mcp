name: PR title

# Pull requests are squash-merged, so the title becomes the commit on main. Release Please reads those commits
# to choose the next version and write the changelog, so titles must follow Conventional Commits.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
