name: PR checks

# Pull requests are squash-merged, so the title becomes the commit on main. Release Please reads those commits
# to choose the next version and write the changelog, so titles must follow Conventional Commits. Every change
# answers an issue, and its PR closes it on merge.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linked-issue:
    name: Linked issue
    runs-on: ubuntu-latest
    # Bots (Dependabot updates, Release Please releases) don't answer issues.
    if: github.event.pull_request.user.type != 'Bot'
    steps:
      - name: The description closes an issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) +(gdhub-io/character-forge-mcp)?#[0-9]+'; then
            echo "Linked issue found."
          else
            echo "::error::Start the PR description with 'Closes #<issue number>'. Every change answers an issue (see CONTRIBUTING.md)."
            exit 1
          fi
