name: Release

# On every push to main, Release Please keeps a release PR up to date (version bump in package.json and
# .claude-plugin/plugin.json and server.json, CHANGELOG.md). Merging that PR tags the release, creates the GitHub
# release, publishes the package to npm and lists the new version in the official MCP Registry.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # A personal token lets CI run on the release PR (PRs opened with GITHUB_TOKEN don't trigger workflows).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7
      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5+.
      - if: ${{ steps.release.outputs.release_created }}
        run: npm install -g npm@latest
      - if: ${{ steps.release.outputs.release_created }}
        run: npm ci && npm test
      # Trusted publishing when it is set up on npmjs.com; otherwise the NPM_TOKEN secret.
      - if: ${{ steps.release.outputs.release_created }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # The MCP Registry only holds metadata (server.json) pointing at the npm package, so it goes after npm.
      # The publisher is pinned; GitHub OIDC proves the io.github.gdhub-io namespace, no token needed.
      - if: ${{ steps.release.outputs.release_created }}
        env:
          MCP_PUBLISHER_VERSION: v1.8.9
        run: |
          curl -sSfL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
